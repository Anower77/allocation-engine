# Single-node Elasticsearch 7.16 + Kibana for the driver geo demo.
#
#   elasticsearch -> http://localhost:9200
#   kibana        -> http://localhost:5601  (Dev Tools: /app/dev_tools#/console)
#
# Security is disabled and the disk watermark is turned off so the tutorial
# works even on a nearly-full disk. Tutorial only — do not use in production.
#
#   docker compose up -d       # start
#   docker compose down        # stop (keeps data)
#   docker compose down -v     # stop + wipe data
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.3
    container_name: es716
    environment:
      - node.name=es716
      - cluster.name=driver-demo
      - discovery.type=single-node
      - xpack.security.enabled=false                          # tutorial only — no auth
      - cluster.routing.allocation.disk.threshold_enabled=false  # ignore full-disk watermark
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:7.16.3
    container_name: kibana716
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  esdata:
    driver: local
