# Full demo stack: Kafka (KRaft, no Zookeeper) + Temporal dev server + our
# three Go services. Bring it all up with:  docker compose up --build
services:
  # ----- Kafka broker (single node, KRaft mode) -------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: ride_kafka
    ports:
      - "9092:9092"   # external listener for tools on the host
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = used by containers on the compose network (kafka:29092)
      # EXTERNAL = used from the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Pre-create the topic with 3 partitions so partitioning is visible.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ----- One-shot: create the topic with 3 partitions up front ----------
  # Without this, a consumer can join the group before the topic's
  # partitions exist and get assigned 0 partitions until restarted.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: ride_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
          --create --if-not-exists --topic ride-requests \
          --partitions 3 --replication-factor 1
        echo "topic ride-requests ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic ride-requests
    restart: "no"

  # ----- Kafka UI: see topics, partitions, offsets, consumer groups -----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ride_kafka_ui
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ----- Temporal dev server (in-memory) + Web UI -----------------------
  temporal:
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1
    container_name: ride_temporal
    entrypoint: temporal server start-dev --log-format=pretty --ip 0.0.0.0
    ports:
      - "7244:7233"   # gRPC frontend (host 7244 -> container 7233)
      - "8244:8233"   # Temporal Web UI (host 8244 -> container 8233)
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address localhost:7233 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ----- Our Go services ------------------------------------------------
  worker:
    build: .
    container_name: ride_worker
    entrypoint: ["worker"]
    environment:
      TEMPORAL_HOSTPORT: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy

  consumer:
    build: .
    container_name: ride_consumer
    entrypoint: ["consumer"]
    restart: on-failure
    environment:
      KAFKA_BROKERS: kafka:29092
      TEMPORAL_HOSTPORT: temporal:7233
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy

  producer:
    build: .
    container_name: ride_producer
    entrypoint: ["producer"]
    restart: on-failure
    ports:
      - "8081:8080"   # POST http://localhost:8081/rides (host 8081 -> container 8080)
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
